[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popanepy"
version = "0.1.0"
description = "Python package for POPANE emotion study data analysis"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "polars",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "duckdb",
    "requests",
    "alive_it",
    pyarrow
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emotion = ["meta/*.xlsx", "meta/*.csv", "meta/*.json"]
